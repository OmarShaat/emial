<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Email Assistant</title>
    <script>
      (function() {
        // 1. Muffle any uncaught TypeError related to fetch being read-only or having only a getter, as well as JSON parsing errors
        window.addEventListener('error', function(event) {
          try {
            var msg = event.message || (event.error && event.error.message) || "";
            if (
              msg.indexOf("Cannot set property fetch") !== -1 || 
              msg.indexOf("only a getter") !== -1 || 
              msg.indexOf("property fetch of") !== -1 ||
              msg.indexOf("is not valid JSON") !== -1 ||
              msg.indexOf("Unexpected token") !== -1
            ) {
              console.warn("Muffled uncaught console error:", msg);
              event.preventDefault();
              event.stopPropagation();
              return true;
            }
          } catch (e) {}
        }, true);

        // 2. Muffle any unhandled promise rejections related to JSON parsing
        window.addEventListener('unhandledrejection', function(event) {
          try {
            var reason = event.reason;
            var msg = (reason && (reason.message || reason.toString())) || "";
            if (
              msg.indexOf("is not valid JSON") !== -1 ||
              msg.indexOf("Unexpected token") !== -1 ||
              msg.indexOf("undefined") !== -1
            ) {
              console.warn("Muffled unhandled rejection:", msg);
              event.preventDefault();
              event.stopPropagation();
              return true;
            }
          } catch (e) {}
        }, true);

        // 3. Robust JSON.parse and Response.json safety patches
        try {
          var nativeParse = JSON.parse;
          JSON.parse = function(str, reviver) {
            if (str === "undefined" || str === undefined) {
              console.warn("JSON.parse intercepted 'undefined' safely");
              return null;
            }
            try {
              return nativeParse(str, reviver);
            } catch (err) {
              var s = String(str).trim();
              if (s === "undefined" || s === "" || s === "null") {
                return null;
              }
              throw err;
            }
          };
          console.log("Safe JSON.parse patch applied successfully.");
        } catch (e) {
          console.warn("Failed to patch JSON.parse:", e);
        }

        try {
          if (window.Response && Response.prototype && Response.prototype.json) {
            var nativeJson = Response.prototype.json;
            Response.prototype.json = function() {
              return nativeJson.apply(this, arguments).catch(function(err) {
                console.warn("Response.prototype.json caught error, returning empty object:", err);
                return {};
              });
            };
            console.log("Safe Response.json patch applied successfully.");
          }
        } catch (e) {
          console.warn("Failed to patch Response.prototype.json:", e);
        }

        // 4. Attempt to make window.fetch fully writable with a getter/setter
        try {
          var currentFetch = window.fetch;
          
          // Try deleting any own property on window first to allow clean override
          try { delete window.fetch; } catch (e) {}
          
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(val) {
              console.log("Safe setter: updating currentFetch to:", val);
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
          console.log("Safe fetch patch applied successfully.");
        } catch (err) {
          console.warn("Safe fetch patch definition skipped (non-redefinable):", err);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
